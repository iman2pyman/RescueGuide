name: RescueGuide Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify source and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify bundled offline image assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            guide_abdominal_thrusts.jpg
            guide_adult_airway.png
            guide_adult_breathing.jpg
            guide_adult_compressions.png
            guide_aed_pad_position.png
            guide_checking_respiration.jpg
            guide_child_breathing.png
            guide_child_compressions.png
            guide_choking_back_blows.jpg
            guide_infant_airway.png
            guide_infant_breathing.png
            guide_infant_breathing_check.png
            guide_infant_compressions.jpg
            guide_infant_compressions_onehand.jpg
            guide_recovery_position.jpg
          )
          for asset in "${assets[@]}"; do
            test -s "app/src/main/res/drawable-nodpi/$asset" || {
              echo "Missing bundled image asset: $asset" >&2
              exit 1
            }
          done
          echo "All ${#assets[@]} offline image assets are present."

      - name: Validate Gradle project
        run: gradle --no-daemon --stacktrace tasks --all

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package complete source
        if: success()
        run: |
          zip -qr RescueGuide-0.36.0-dev-FULL-SOURCE.zip . \
            -x ".git/*" ".gradle/*" ".kotlin/*" "*/build/*" "build/*" \
               "RescueGuide-0.33.0-dev-FINAL-SOURCE.zip" \
               "RescueGuide-0.36.0-dev-FULL-SOURCE.zip" \
               "SOURCE_FILES_SHA256.txt"

      - name: Upload complete source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-full-source
          path: RescueGuide-0.36.0-dev-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-verification-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

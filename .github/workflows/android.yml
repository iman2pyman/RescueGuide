name: RescueGuide Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify source and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify bundled offline image assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            guide_abdominal_thrusts.jpg
            guide_adult_airway.png
            guide_adult_breathing.jpg
            guide_adult_compressions.png
            guide_aed_pad_position.png
            guide_checking_respiration.jpg
            guide_child_breathing.png
            guide_child_compressions.png
            guide_choking_back_blows.jpg
            guide_infant_airway.png
            guide_infant_breathing.png
            guide_infant_breathing_check.png
            guide_infant_compressions.jpg
            guide_infant_compressions_onehand.jpg
            guide_recovery_position.jpg
          )
          for asset in "${assets[@]}"; do
            test -s "app/src/main/res/drawable-nodpi/$asset" || {
              echo "Missing bundled image asset: $asset" >&2
              exit 1
            }
          done
          echo "All ${#assets[@]} offline image assets are present."

      - name: Validate Gradle project
        run: gradle --no-daemon --stacktrace tasks --all

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package complete source
        if: success()
        run: |
          zip -qr RescueGuide-0.41.0-FULL-SOURCE.zip . \
            -x ".git/*" ".gradle/*" ".kotlin/*" "*/build/*" "build/*" \
               "*.jks" "*.keystore" "keystore.properties" \
               "RescueGuide-0.33.0-dev-FINAL-SOURCE.zip" \
               "RescueGuide-0.41.0-FULL-SOURCE.zip" \
               "SOURCE_FILES_SHA256.txt"

      - name: Upload complete source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-full-source
          path: RescueGuide-0.41.0-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-verification-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check whether release signing secrets are configured
        id: release-signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release build skipped: configure all four ANDROID_* repository secrets."
          fi

      - name: Restore persistent release keystore
        if: steps.release-signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/rescueguide-release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        if: steps.release-signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify release APK signature
        if: steps.release-signing.outputs.ready == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        if: steps.release-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rescueguide-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

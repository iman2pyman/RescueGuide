name: Import RescueGuide 0.30.0 source ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'RescueGuide-0.30.0-dev-FINAL-SOURCE.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and validate final source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="RescueGuide-0.30.0-dev-FINAL-SOURCE.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Upload $ZIP_FILE to the repository root first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rescueguide-import"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/rescueguide-import"
          test -d "$RUNNER_TEMP/rescueguide-import/RescueGuide"
          test -f "$RUNNER_TEMP/rescueguide-import/RescueGuide/settings.gradle.kts"
          test -f "$RUNNER_TEMP/rescueguide-import/RescueGuide/app/build.gradle.kts"
          # Remove the old project snapshot first to prevent stale files mixing with the new source.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name "$ZIP_FILE" -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/rescueguide-import/RescueGuide/." .

      - name: Commit extracted source while keeping the ZIP backup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Workflow definitions remain under separate maintenance.
          git reset -q -- .github/workflows/android.yml .github/workflows/import-rescueguide.yml || true
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Import RescueGuide 0.30.0-dev final source"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

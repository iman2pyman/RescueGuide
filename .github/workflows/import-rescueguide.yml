name: Import RescueGuide source ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="RescueGuide-0.29.0-dev-source-bundle.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Source ZIP is not present; nothing to import."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/rescueguide-import"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/rescueguide-import"
          test -d "$RUNNER_TEMP/rescueguide-import/RescueGuide"
          cp -a "$RUNNER_TEMP/rescueguide-import/RescueGuide/." .
          rm -f "$ZIP_FILE"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The default Actions token cannot add workflow files.
          # Keep android.yml out of this commit; it will be added separately.
          git reset -q -- .github/workflows/android.yml || true
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Import RescueGuide 0.29.0-dev source from ZIP"
            git push
          fi

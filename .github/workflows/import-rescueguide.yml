name: Import RescueGuide source ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'RescueGuide-0.36.0-dev-FULL-SOURCE.zip'
      - 'RescueGuide-0.33.0-dev-FINAL-SOURCE.zip'
      - '.github/workflows/import-rescueguide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and validate source ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "RescueGuide-0.36.0-dev-FULL-SOURCE.zip" ]; then
            ZIP_FILE="RescueGuide-0.36.0-dev-FULL-SOURCE.zip"
          elif [ -f "RescueGuide-0.33.0-dev-FINAL-SOURCE.zip" ]; then
            ZIP_FILE="RescueGuide-0.33.0-dev-FINAL-SOURCE.zip"
          else
            echo "No supported RescueGuide source ZIP found in repository root."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rescueguide-import"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/rescueguide-import"
          if [ -f "$RUNNER_TEMP/rescueguide-import/RescueGuide/settings.gradle.kts" ]; then
            SOURCE_DIR="$RUNNER_TEMP/rescueguide-import/RescueGuide"
          elif [ -f "$RUNNER_TEMP/rescueguide-import/settings.gradle.kts" ]; then
            SOURCE_DIR="$RUNNER_TEMP/rescueguide-import"
          else
            echo "ZIP layout is invalid: settings.gradle.kts was not found."
            exit 1
          fi
          test -f "$SOURCE_DIR/app/build.gradle.kts"
          # Replace the source snapshot while preserving repository metadata and the uploaded ZIP.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name "$ZIP_FILE" -exec rm -rf {} +
          cp -a "$SOURCE_DIR/." .

      - name: Commit imported source and updated Android workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the repository-managed workflows; the ZIP's workflow copies
          # are intentionally not committed by this importer.
          git restore --source=HEAD --staged --worktree -- .github/workflows/import-rescueguide.yml .github/workflows/android.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Import RescueGuide 0.36.0-dev source"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

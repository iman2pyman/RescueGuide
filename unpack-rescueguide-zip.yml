name: Import RescueGuide source ZIP

on:
  push:
    paths:
      - 'RescueGuide-0.29.0-dev-source-bundle.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="RescueGuide-0.29.0-dev-source-bundle.zip"
          test -f "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/rescueguide-import"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/rescueguide-import"
          test -d "$RUNNER_TEMP/rescueguide-import/RescueGuide"
          cp -a "$RUNNER_TEMP/rescueguide-import/RescueGuide/." .
          rm -f "$ZIP_FILE"

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Import RescueGuide 0.29.0-dev source from ZIP"
            git push
          fi
